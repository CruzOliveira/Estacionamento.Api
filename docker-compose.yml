services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: estacionamento-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=Estacionamento;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
      Serilog__WriteTo__2__Args__serverUrl: "http://seq:5341"
    ports:
      - "8080:8080"
    depends_on:
      - sqlserver
      - seq

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: estacionamento-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  seq:
    image: datalust/seq:latest
    container_name: estacionamento-seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD}
    ports:
      - "5341:80"
    volumes:
      - seq_data:/data

volumes:
  sqlserver_data:
  seq_data: