events {}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream estacionamento {
        zone estacionamento 64k;
        server api:8080 resolve;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://estacionamento;
            proxy_set_header Host $http_host;

            # Para visualizar qual API respondeu durante o estudo
            add_header X-API-Instance $upstream_addr always;
        }
    }
}